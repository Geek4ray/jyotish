[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jyotish"
version = "0.1.0"
description = "Vedic astrology engine: every classical quantity computed exactly, with stated uncertainty"
requires-python = ">=3.11"
dependencies = [
    "pyswisseph>=2.10",
    "pydantic>=2",
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jyotish = "jyotish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
