[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jyotish"
version = "0.1.0"
description = "Vedic astrology engine: every classical quantity computed exactly, with stated uncertainty"
requires-python = ">=3.11"
dependencies = [
    "pyswisseph>=2.10",
    "pydantic>=2",
    "numpy>=1.26",
    "pyyaml>=6",
    "jsonschema>=4.18",
    "anthropic>=1.0,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "sqlalchemy>=2", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "sqlalchemy>=2", "uvicorn>=0.29", "playwright>=1.44"]

[project.scripts]
jyotish = "jyotish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jyotish = ["data/*.json", "data/*.tsv.gz", "data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
