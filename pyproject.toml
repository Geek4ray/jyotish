[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jyotish"
version = "0.1.0"
description = "Vedic astrology engine: every classical quantity computed exactly, with stated uncertainty"
requires-python = ">=3.11"
dependencies = [
    "pyswisseph>=2.10",
    "pydantic>=2",
    "numpy>=1.26",
    "pyyaml>=6",
    "jsonschema>=4.18",
    "anthropic>=1.0,<2",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "sqlalchemy>=2", "uvicorn>=0.29", "alembic>=1.13", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "sqlalchemy>=2", "uvicorn>=0.29", "alembic>=1.13",
       "psycopg[binary]>=3.1", "playwright>=1.44"]
# The Phase 0 cross-check's reference implementation (scripts/crosscheck.py). PyJHora is AGPL and a
# development-time reference only: never imported by src/. It declares no dependencies of its own;
# these are the ones its core imports (pyIslam, for its Hijri calendar, is not on PyPI and not needed).
# SPEC Layer 6 validation (scripts/validate.py): all BSD; statsmodels brings pandas (BSD).
validate = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "statsmodels>=0.14"]
crosscheck = ["PyJHora==4.8.7", "python-dateutil", "ephem", "geocoder", "geopy", "hijridate", "pytz",
              "requests", "timezonefinder", "certifi"]

[project.scripts]
jyotish = "jyotish.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jyotish = ["data/*.json", "data/*.tsv.gz", "data/*.yaml", "migrations/*.py", "migrations/*.mako",
           "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "crosscheck: the Phase 0 cross-check against PyJHora (skips when PyJHora is absent)",
    "live: calls the Anthropic API (skips unless JYOTISH_LIVE_NARRATION=1)",
]
