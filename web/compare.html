<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare — Jyotish Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/site.css">
<script type="module" src="/js/compare-page.js"></script>
</head>
<body data-screen="compare">
<header class="site-header" id="site-header"></header>
<main class="wrap compare" id="compare" data-state="loading" aria-live="polite">
  <form class="card" id="token-form" hidden>
    <h2 id="signin-heading"></h2>
    <div class="field"><label for="token" id="token-label"></label><input id="token" type="password" autocomplete="off" required></div>
    <button class="button" type="submit" id="token-open"></button>
    <p class="error small" id="token-error" role="alert"></p>
  </form>
  <section id="compare-body" hidden>
    <p class="muted" id="compare-lead"></p>
    <div class="compare-columns">
      <article class="compare-column" id="reading-A" data-label="A"></article>
      <article class="compare-column" id="reading-B" data-label="B"></article>
    </div>
    <form class="card compare-question" id="compare-form">
      <h2 id="compare-heading"></h2>
      <fieldset class="choices" id="compare-choices"></fieldset>
      <div class="field"><label for="compare-why" id="compare-why-label"></label><textarea id="compare-why" rows="4" maxlength="4000" required></textarea></div>
      <button class="button" type="submit" id="compare-submit"></button>
      <p class="error small" id="compare-error" role="alert"></p>
    </form>
    <section class="card" id="compare-reveal" hidden></section>
  </section>
</main>
<footer class="site-footer" id="site-footer"></footer>
</body>
</html>
