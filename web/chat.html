<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tatva — ask your chart</title>
<meta name="description" content="A conversation with your birth chart: plain answers, checked against your chart.">
<meta name="theme-color" content="#07090F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/css/chat.css">
<script type="module" src="/js/chat.js"></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="/chat.html"><span class="brand-name">TATVA</span><span class="brand-by">BY SHREE NA RAYAN</span></a>
  <p class="check-line" id="check-line" hidden></p>
</header>

<div class="layout">
  <main class="talk" id="talk">
    <ol class="conversation" id="conversation" aria-live="polite"></ol>

    <section class="first" id="first">
      <div class="said">
        <span class="mark" aria-hidden="true"><span></span></span>
        <p id="first-line"></p>
      </div>
      <form class="birth" id="birth-form" novalidate>
        <label>Date of birth<input id="date" name="date" type="date" required></label>
        <label>Time of birth<input id="time" name="time" type="time" step="1" required></label>
        <label class="wide place">Place of birth
          <input id="place" name="place" type="text" placeholder="City, state or country" autocomplete="off"
                 role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="place-list" required>
          <ul class="place-list" id="place-list" role="listbox" hidden></ul>
        </label>
        <input id="lat" name="lat" type="hidden"><input id="lon" name="lon" type="hidden"><input id="tz" name="tz" type="hidden">
        <button type="submit" class="wide primary" id="draw">Draw my chart</button>
        <p class="wide fine" id="birth-status" role="status"></p>
      </form>
    </section>

    <div class="ask" id="ask-area" hidden>
      <div class="chips" id="chips"></div>
      <form class="ask-form" id="ask-form">
        <label for="message" class="visually-hidden">Ask your chart</label>
        <input id="message" name="message" type="text" maxlength="1000" autocomplete="off">
        <button type="submit" id="send" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </div>
    <p class="trust" id="trust"></p>
  </main>

  <aside class="sky" id="sky" hidden>
    <svg id="wheel" viewBox="0 0 340 340" role="img"></svg>
    <p class="reading-now" id="reading-now" aria-live="polite"></p>
  </aside>
</div>
</body>
</html>
