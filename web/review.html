<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review — Jyotish Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/site.css">
<script type="module" src="/js/review-page.js"></script>
</head>
<body data-screen="review">
<header class="site-header" id="site-header"></header>
<main class="wrap" id="review" data-state="loading" aria-live="polite">
  <form class="card" id="token-form" hidden>
    <h2>Reviewer sign-in</h2>
    <div class="field"><label for="token">Reviewer token</label><input id="token" type="password" autocomplete="off" required></div>
    <button class="button" type="submit">Open the reading</button>
    <p class="error small" id="token-error" role="alert"></p>
  </form>
  <div id="review-body"></div>
</main>
<footer class="site-footer" id="site-footer"></footer>
</body>
</html>
