<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review — Jyotish Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/site.css">
<script type="module" src="/js/review-page.js"></script>
</head>
<body data-screen="review">
<header class="site-header" id="site-header"></header>
<main class="wrap guided" id="review" data-state="loading" aria-live="polite">
  <form class="card" id="token-form" hidden>
    <h2 id="signin-heading"></h2>
    <div class="field"><label for="token" id="token-label"></label><input id="token" type="password" autocomplete="off" required></div>
    <button class="button" type="submit" id="token-open"></button>
    <p class="error small" id="token-error" role="alert"></p>
  </form>
  <div class="guided-layout" id="guided" hidden>
    <aside class="guided-chart card" id="guided-chart" aria-labelledby="chart-heading"></aside>
    <section class="guided-steps" id="guided-steps">
      <div class="guided-progress" id="guided-progress"></div>
      <div class="card guided-panel" id="guided-panel" tabindex="-1"></div>
      <p class="tiny muted guided-keys" id="guided-keys"></p>
    </section>
  </div>
</main>
<footer class="site-footer" id="site-footer"></footer>
</body>
</html>
