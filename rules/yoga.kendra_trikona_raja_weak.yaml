id: yoga.kendra_trikona_raja_weak
family: raja
school: parashari
status: experimental
# Uncited and out of default scoring. The kendra-trikona relation of
# yoga.kendra_trikona_raja where at least one of the two lords also owns a Trika house,
# which BPHS 34.15 excludes; here such a lord weakens the yoga (x0.75 each) instead.
when:
  pair:
    a: {lord_of: [1, 4, 7, 10]}
    b: {lord_of: [1, 5, 9]}
    related_by: [conjunction, mutual_aspect, exchange]
    either: {lord_of: [6, 8, 12]}
  basis: [lagna]
modifiers:
  - if: {lord_of: [6, 8, 12]}
    of: a
    scale: 0.75
  - if: {lord_of: [6, 8, 12]}
    of: b
    scale: 0.75
report: [lordships]
themes: { authority: +3, reputation: +3, career: +2 }
outcomes: [career_status]
narration_key: kendra_trikona_raja_weak
