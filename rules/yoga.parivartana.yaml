id: yoga.parivartana
family: parivartana
names: [Parivartana, exchange]
school: parashari
source:
  - {text: Phaladeepika, edition: Sastri 1937, chapter: 6, verse: 32, checked: true,
     note: "66 exchanges of bhava lords: 30 involving the 6th, 8th or 12th lord are Dainya, 8 involving the 3rd lord Khala, the rest Maha"}
status: classical_unconfirmed
# Two of the seven in each other's signs. Phaladeepika 6.32 classes an exchange by the
# bhava lords that exchange. A planet owning two houses makes that ambiguous, so the class
# is read two ways: by the two houses exchanged, and by every house the two planets own.
# Both are reported, and each weakens the fire on its own terms.
when:
  pair:
    a: {planet_in: [Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn]}
    b: {planet_in: [Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn]}
    related_by: [exchange]
  basis: [lagna]
modifiers:
  - if: class_by_houses == dainya
    of: pair
    scale: 0.5
  - if: class_by_houses == kahala
    of: pair
    scale: 0.75
  - if: class_by_lordship == dainya
    of: pair
    scale: 0.8
report: [parivartana_class]
themes: { fortune: +2, house_linkage: +2 }
outcomes: [career_status, property_purchase]
confidence_base: 0.6
stability_min: 0.5
narration_key: parivartana
