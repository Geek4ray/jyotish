# The suite on every push, then the evaluation harness, which fails when any number in the new
# scorecard is worse than in the committed docs/scorecard.json (scripts/evaluate.py --compare).
name: ci
on: push

jobs:
  test:
    # Pinned: ubuntu-latest is moving to Ubuntu 26, and a new image is a new cache key, which is
    # how one install took 13 minutes and the next 1 (review 2026-10-23, F15).
    runs-on: ubuntu-24.04
    # The harness is the long step (two 20,000-subject synthetic runs); 75 leaves room for a slow
    # runner without hiding a hang. The pip cache keeps the wheels (pyswisseph's build among them)
    # between runs, keyed on pyproject.toml; Playwright's Chromium is cached the same way.
    timeout-minutes: 75
    # A scratch Postgres for tests/test_db.py's Postgres migration test (skipped without it).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jyotish
          POSTGRES_PASSWORD: jyotish
          POSTGRES_DB: jyotish_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jyotish" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      JYOTISH_TEST_POSTGRES_URL: postgresql+psycopg://jyotish:jyotish@localhost:5432/jyotish_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Cache Playwright's Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: "Install the engine and the dev tools (a venv, since the system setuptools breaks pyswisseph)"
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev,validate]"
          .venv/bin/playwright install --with-deps chromium
      # Its own step: a PyJHora install failure fails only this step. The cross-check test then
      # skips, and the harness reports the cross-check as skipped rather than worse.
      - name: Install the cross-check extra (PyJHora, AGPL, development only)
        continue-on-error: true
        run: .venv/bin/pip install -e ".[crosscheck]"
      - name: pytest
        run: .venv/bin/pytest -q
      - name: Evaluation harness against the committed scorecard
        run: .venv/bin/python scripts/evaluate.py --out "$RUNNER_TEMP/scorecard" --compare docs/scorecard.json
      - name: Keep the scorecard of this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: ${{ runner.temp }}/scorecard.*

  # The deployable image (docs/deploy.md): it builds, starts on SQLite, and starts against Postgres
  # through docker-compose.yml, each reporting a healthy engine and a migrated database at /health.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t jyotish:ci .
      - name: Start it on SQLite and check /health
        run: |
          docker run -d --name app -p 8000:8000 jyotish:ci
          for i in $(seq 60); do curl -fsS http://127.0.0.1:8000/health > health.json && break; sleep 2; done
          cat health.json
          python3 -c "import json; h = json.load(open('health.json')); assert h['status'] == 'ok' and h['database']['dialect'] == 'sqlite' and h['database']['revision'] == h['database']['head'], h"
          docker rm -f app
      - name: Start it on Postgres with docker compose and check /health
        env:
          POSTGRES_PASSWORD: ci-only
        run: |
          docker compose up -d --wait db
          docker compose up -d app
          for i in $(seq 60); do curl -fsS http://127.0.0.1:8000/health > health.json && break; sleep 2; done
          cat health.json
          python3 -c "import json; h = json.load(open('health.json')); assert h['status'] == 'ok' and h['database']['dialect'] == 'postgresql' and h['database']['revision'] == h['database']['head'] and h['narration'] == 'no key', h"
          docker compose logs app | tail -20
      - name: Back the Postgres database up, restore-check the dump, prune past the retention
        env:
          POSTGRES_PASSWORD: ci-only
        run: |
          docker compose exec -T app sh -c 'mkdir -p /data/backups && touch -d "20 days ago" /data/backups/jyotish-old.dump'
          docker compose exec -T -e RETENTION_DAYS=14 app /app/scripts/pg_backup.sh | tee backup.log
          grep -q "pg_backup: wrote /data/backups/jyotish-" backup.log
          docker compose exec -T app sh -c 'test ! -e /data/backups/jyotish-old.dump && pg_restore --list /data/backups/jyotish-*.dump | grep -q "TABLE public readings"'
          docker compose down -v
